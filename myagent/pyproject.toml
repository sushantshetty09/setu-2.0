[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myagent"
version = "0.1.0"
description = "A local autonomous coding agent powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "ollama>=0.4.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "pydantic>=2.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
myagent = "myagent.ui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Ollama running locally (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
